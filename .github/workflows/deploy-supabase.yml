name: Deploy Supabase (база данных)

# Применяет новые миграции из supabase/migrations к базе Supabase.
# Подключается к базе напрямую по строке подключения (секрет SUPABASE_DB_URL),
# токен доступа Supabase не нужен.
# Запускается при изменениях в папке supabase/ или вручную (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секрета
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Не задан секрет SUPABASE_DB_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"[YOUR-PASSWORD]"*) echo "::error::В SUPABASE_DB_URL не подставлен пароль вместо [YOUR-PASSWORD]"; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Применение миграций
        run: supabase db push --db-url "$SUPABASE_DB_URL"
