name: Deploy Supabase (база данных)

# Применяет новые миграции из supabase/migrations к проекту Supabase.
# Запускается при изменениях в папке supabase/ или вручную (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Подключение к проекту
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Применение миграций
        run: supabase db push
